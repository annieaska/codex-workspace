referred to as dry skin, is a common dermatological condition affecting almost a third of the population. Successful treatment of the condition traditionally involves the application of cosmetic products facilitating the moisturisation of the skin with a range of ingredients including glycerol and fatty acids. While the effectiveness of these treatments is not in question, limited information exists on the impact on the skin microbiome following use of these products and the improvement in skin hydration. Here, we describe improvements in skin barrier properties together with increased levels of cholesterol, ceramides and long-chain fatty acids following application of Body Lotion. Concomitant alterations in the skin microbiome are also seen via 16S rRNA metataxonomics, in combination with both traditional and novel informatics analysis. Following 5 weeks of lotion use, beneficial skin bacteria are increased, with improvements in microbiome functional potential, and increases in pathways associated with biosynthesis of multiple long chain fatty acids.", "authors": [{"givenNames": "Barry", "lastName": "Murphy"}, {"givenNames": "Sally", "lastName": "Grimshaw"}, {"givenNames": "Michael", "lastName": "Hoptroff"}, {"givenNames": "Sarah", "lastName": "Paterson"}, {"givenNames": "David", "lastName": "Arnold"}, {"givenNames": "Andrew", "lastName": "Cawley"}, {"givenNames": "Suzanne E.", "lastName": "Adams"}, {"givenNames": "Francesco", "lastName": "Falciani"}, {"givenNames": "Tony", "lastName": "Dadd"}, {"givenNames": "Richard", "lastName": "Eccles"}, {"givenNames": "Alex", "lastName": "Mitchell"}, {"givenNames": "William F.", "lastName": "Lathrop"}, {"givenNames": "Diana", "lastName": "Marrero"}, {"givenNames": "Galina", "lastName": "Yarova"}, {"givenNames": "Ana", "lastName": "Villa"}, {"givenNames": "John S.", "lastName": "Bajor"}, {"givenNames": "Lin", "lastName": "Feng"}, {"givenNames": "Dawn", "lastName": "Mihalov"}, {"givenNames": "Andrew E.", "lastName": "Mayes"}], "journal": {"title": "Scientific Reports", "issn": "2045-2322", "volume": "12", "elocationId": "5223"}, "keywords": ["Microbiome", "Microbiology techniques", "Quality of life"], "articleType": "research-article", "publicationDate": {"year": "2022", "month": "3", "day": "26"}, "sections": [{"title": "Introduction", "text": "The human skin microbiome comprises the commensal microorganisms found on human skin, their combined genetic material and the environment in which they live1. The outermost skin layer, the stratum corneum, is composed of multiple layers of fully cornified keratinocytes embedded in a lipid matrix and crucially provides an environment for commensal skin microbiome colonisation2. Keratinocytes also play a key role in microbiome management effecting attributes such as pH, osmolarity and aridity3. Human skin can be divided into three location types based on physiological characteristics namely dry, sebaceous and moist sites. Each of these sites types harbour a distinct microbiome profile comprising organisms best suited to utilise the available nutrients in the specific niche4. Dry sites (leg or forearm) are commonly colonised by the most diverse range of bacteria from the Proteobacteria and Firmicutes phyla; sebaceous sites (face) by members of the Cutibacterium genus and moist sites (axilla), by Staphylococcus and Corynebacterium species5.\n\nSkin microbiome composition has been shown to be relatively stable over time despite perturbations brought on by daily activities and hygiene practice6. However, more significant and prolonged dysbiotic states have been documented in multiple skin conditions including atopic dermatitis7, acne8 and dandruff9. Multiple studies have shown significant differences either in community composition between healthy and diseased states with treatment for the associated condition resulting in a renormalizing of community steady state10.\n\nXerosis, commonly referred to as dry skin, affects almost a third of the global population11. Characterised by rough or scaling skin, the prevalence of cosmetic dry skin has been associated with a number of factors including the environment, age, gender and genetic makeup12. Cosmetic dry skin can have a significant impact on quality of life, potentially leading to more serious conditions such as atopic dermatitis, facilitated by the penetration of allergens through a damaged epidermal barrier13. Studies have also demonstrated that barrier defects can lead to increases in systemic inflammation14.\n\nStratum corneum (SC) lipids play a crucial role in the permeation function of skin barrier, as well as many other aspects of health and disease15. The main lipid classes are ceramides, fatty acids and cholesterol, present in an approximately equal molar ratio16,17. These lipids form a highly-organised and densely-packed lamellar structure in the SC. There is significant heterogeneity within these lipids groups and especially within the ceramides with over 400 species and 12 subclasses having been identified in human SC. In xerosis, a strong correlation between dry skin attributes (conductance, dryness, roughness and scaliness) and the level of ceramides has been observed18. In atopic skin, decreased levels of ceramides and long-chain FFAs were observed with an increase of transepidermal water loss (TEWL)19,20. In addition to the decrement of ceramides, there is an apparent dysregulation of the ceramide profiles reported in atopic eczema (AE), with a significantly increased level of a total short-chain length of 34 carbon atoms18. The compositional chain length has also been associated with altered barrier function15,21. Treatment of xerosis regularly includes the use of humectants, occlusives or emollients to restore barrier integrity and improve the hydration of the SC, which in turn supports the establishment of a health-associated microbiome2.\n\nWhereas assessment of the skin microbiome between health and disease states such as acne and atopic dermatitis are commonplace, almost no work exists examining the cosmetic dry skin microbiome and its response to treatment. This work investigates the impact of a marketed Body Lotion (BL) on both skin condition and the skin microbiome using a combination of qualitative and quantitative measures."}, {"title": "Results", "text": "", "subsections": [{"title": "Assessment of skin barrier properties", "text": "Post intervention, visual assessment scores and corneometer measurements demonstrated significant improvements in hydration status (Fig. 1a,b). Mean visual dryness scores (with standard deviation) decreased from 2.3 (0.4) to 0.2 (0.2); whilst mean corneometer values increased from 22.6 (5.7) to 44.0 (10.2).\n\n[Figure: Figure 1]\n\nStratum corneum cohesivity also improved with 5 weeks of product application with mean level of total protein (with standard deviation) removed by 5 sequential tape strips reducing from 944 (283 µg) to 569 µg (130 µg) (Fig. 1c). This increase in cohesivity was still evident following 20 sequential tape strips (Fig. 1d).\n\nSamples were fractionated on amino-propyl solid phase extraction (SPE) columns to remove extracted adhesive material and partition the samples into cholesterol, ceramide and FFA fractions (see Supplementary Methods). FFA and Cholesterol measurements are quantitative. The amount of each analyte is back-calculated from the standard curve (has its own internal standard). Ceramide measurement is a semi-quantitative method due to its lack of the full set of the standards covering all ceramide classes and chain length.\n\nFree fatty acid levels were measured in the outer-most 5 tape strips at both timepoints. Total FFA (with standard deviation) increased from 51.06 protein (25.63 pmol/µg) to 134.05 pmol/µg (68.07 pmol/µg), p-value \u003c 0.001. Individual species analysis revealed significant increases in the levels of several FFAs from chain length C14:0 to C20:0 following the product application phase (Table 1). Levels of C22:0 also increased although the increase was not statistically significant, p-value = 0.086. Cholesterol (with standard deviation) was measured in the outer-most 5 tape strips at both timepoints with levels increasing from 29.85 pmol/µg protein (11.51 pmol/µg) to 32.35 pmol/µg protein (10.66 pmol/µg), p-value = 0.081. For depths of 16–20 tapes strips values at baseline were 40.94 pmol/µg (13.58 pmol/µg) rising post application to 63.34 pmol/µg (21.10 pmol/µg), p-value \u003c 0.001.\n\nAverage ceramides levels (with standard deviation) measured in 20 tape strips at baseline were 2.85 pmol/µg protein (0.70 pmol/µg) which rose to 3.80 pmol/µg protein (0.71 pmol/µg) post intervention—representing a 33% increase (p ≤ 0.0001). 358 ceramide species measured were assigned to their respective classes22 with class sum values calculated at both timepoints. For 9 of the 12 classes, statistically significant increases were seen in the levels post intervention (Table 2). The molar ratio among lipid groups of Cer:FFA:CHE is approximately 1:18:10 in our measures. The smaller amount of ceramide is due to the semi-quantitative approach and smaller sets of ceramides included in the calculation after a 70% occupational threshold described in the Supplementary Information.\n\nCorneometer values of skin hydration were found to be positively associated with levels of both FFA (r = 0.79, p \u003c 0.0001) and ceramides (r = 0.44, p = 0.007) (Fig. 2). Simple linear regression analysis was conducted to estimate the correlation and statistical significance. Pearson’s correlation method was used to calculate the correlation coefficient. Statistical significance was calculated by Student’s t-test.\n\n[Figure: Figure 2]"}, {"title": "Microbiome assessment", "text": "DNA sequencing of 70 samples (36 baseline and 34 post intervention) resulted in the generation of 22.8 million reads with an average read count of 326,333 reads per sample (min 63,892, max 975,103) Taxonomic assessment of the skin microbiome was visualized at Baseline (Fig. 3a) and Post Intervention (Fig. 3b).\n\n[Figure: Figure 3]\n\nAt both timepoints dominant taxa were Cutibacterium acnes, Staphylococcus epidermidis and Staphylococcus hominis, aligning with published skin microbiome studies4. Differential abundance using ANCOM23 was carried out at both genus and species level at each timepoint. A single genus (Xanthomonas) and species (Xanthomonas campestris) were found to be more abundant in subjects post product application.\n\nSamples were rarefied at 50,000 reads per sample in advance of diversity analysis. Alpha (Chao1 and Shannon) and Beta diversity (Unweighted and Weighted Unifrac)24 analyses were carried out to examine differences between baseline samples and following lotion use; however no statistically significant differences were seen (data not shown).\n\nMicrobiome functional profile were examined using Picrust225 and statistical analysis carried out using LEfSe26, p-value 0.01 and LDA > 2. Nine functional pathways were shown to be elevated following product application in comparison to baseline (Fig. 3c). The majority of these pathways represented an increase in microbial production of skin-relevant fatty acids.\n\nTo quantitatively examine the impact of the intervention on akin bacteria the levels of total bacteria and the common health-associated commensal bacterium S. epidermidis were quantified using qPCR. No differences between timepoints were seen in the levels of total bacteria (Fig. 3d); however, a statistically significant increase (p \u003c 0.01) was seen in the levels of S. epidermidis post intervention (Fig. 3e).\n\nMicrobiome network of the population (MNP) for all samples at both timepoints was calculated. Analysis showed that network metrics including Mean Degree, Edge Number and Robustness were directionally increased post intervention (Fig. 4a). Additionally, networks from subjects after lotion use showed decreased fragility in comparison to networks at baseline. However, statistical analysis of these metrics using an 80% bootstrapping approach revealed no significant differences between networks when averaged across all samples at both timepoints (Fig. 4b).\n\n[Figure: Figure 4]\n\nSingle sample networks were produced following methodologies described previously27. The production of n-1 networks facilitates the analysis of networks at the subject level and additionally allows improved statistical analysis of associated network metrics. Indicative examples of single sample networks can be seen in Fig. 4c. All single sample networks produced are available in Supplementary Material (Fig. S1). Statistical analysis of network metrics based on the aggregate single sample networks showed statistically significant differences for all metrics between baseline and post intervention, (p \u003c 0.01) (Fig. 4d)."}]}, {"title": "Discussion", "text": "The aim of this study was to examine the impact on both host biomarkers and the skin microbiome following 5 weeks use of a marketed lotion containing glycerol, FFAs and a small amount of occlusives. Analysis of multiple skin biomarkers showed consistent improvement after the intervention period. Expertly measured visual skin dryness, an assessment of the impact on the upper layers of the stratum corneum, showed significant improvements for the study population. The impact however was not limited to the outermost levels of the skin since improved stratum corneum cohesivity was demonstrated even after 20 tape strippings. It should also be noted that improvements in skin condition were not only evident at the end of the 5 weeks of lotion use, as improvements in visual dryness were observed earlier. Indeed 86% of the study participants in this cell showed a significant improvement in skin dryness score after only 7 days of lotion use (data not shown).\n\nThe levels of SC lipids have been extensively linked to skin function15. In particular, lower levels of lipids, and especially longer chain lipids, have been reported in compromised skin18,19. In the current study, significant increases were seen in total ceramides, FFAs and cholesterol following body lotion application. These increases and their correlation to improvements in skin dryness provide further evidence for the critical role of lipids in maintaining good SC hydration and barrier function. While it is expected that some of the increase in the levels of C16:0 and C18:0 may be due to residual product deposition, the increase in longer chain fatty acids e.g., C20:0 and C22:0 suggests both increased synthesis and elongation from shorter chain precursors. It is also reasonable to assume that the sizable increases in C16:0 and C18:0 will provide the substrates for the sustained production of elongated species. Given their inherent heterogeneity within the SC, the increases seen in 9/12 classes of ceramide, together with the scale of those increases demonstrates wide-ranging improvements across the spectrum of these lipids. This is again consistent with improvements in SC hydration and barrier function and goes beyond the changes which might be achieved by topical supplementation with a small number of specific ceramide species. Whilst the changes in skin hydration may be attributable to the glycerol and occlusives present in the lotion tested28, the changes in lipid composition are more likely attributable to the free fatty acids provided. Studies have previously demonstrated the ability of ex vivo skin to produce greater levels of fatty acids (and in particular elongated species) when provided with shorter chain precursors29. The current study adds to this evidence by testing in vivo in human participants.\n\nIn addition to improvements in skin condition and composition, changes in the skin microbiome were also examined. Microbiome assessment of skin pre- and post-lotion use showed limited differences between the groups using standard analysis methods for the assessment of compositional metataxonomic data. No differences were seen in alpha and beta diversity metrics with only a single genus/species being differentially abundant, Xanthomonas/X. campestris, the increased abundance of which will be discussed later.\n\nMetataxonomic assessment of the microbiome is limited in its ability to quantitatively access individual members of the microbiome as these methodologies only examine percentage compositional changes which can mask absolute abundance alterations. Based on its commonly accepted role as a beneficial skin bacterium30 the absolute abundance of S. epidermidis along with total bacterial abundance at baseline and after lotion use was examined to determine if there was an alteration in the number of bacteria present. While no differences were seen in total bacterial levels a significant increase was seen for S. epidermidis post intervention. Quantitative assessment of Staphylococcus aureus was also carried out on all samples however 95% of samples were below the limit of detection of the assay (data not shown). S. epidermidis is one of the most important members of the microbiome for maintenance of skin health30. S. epidermidis has been shown to activate skin TLR2 and TLR3 via the production of lipoteichoic acid stimulating the production of human β-defensins and inhibiting the inflammatory cytokine release and inflammation31–33. More recently a potential role for S. epidermidis in protecting against skin cancer via the production of 6-N-hydroxyaminopurine has been postulated; however further investigations in this area are warranted34. Indeed, recent activities have examined the beneficial impact of the application of autologous S. epidermidis to the skin of clinical subjects. Augmentation of resident populations with cultured S. epidermidis was shown to increase the lipid content of the skin, suppress water evaporation and helped to maintain the skins acidic pH through the production of lactic acid, a metabolic endpoint of glycerol fermentation35. Even more intriguingly, recent investigations into the actions of S. epidermidis on skin have demonstrated the presence of an active secreted sphingomyelinase in S. epidermidis clinical isolates potentially contributary to the release of free ceramides on skin36. The increase in S. epidermidis numbers following lotion use in this study is considered to be in line with an improvement in the condition of the underlining stratum corneum and its associated commensal microbiome.\n\nPredictive functional analysis was carried out on all samples to determine changes in microbial functional profile following application. As discussed earlier some of the increases in skin lipids identified following product use are likely a consequence of product deposition however the increase in the bacterial potential to produce C16:0, C16:1 and C18:1 lipids, among others, present the intriguing proposition that the increase in skin lipids is at least partially derived from alterations in the functional output of the skin microbiome. Increased levels of bacterially derived oleate, palmitoleate, stearate and palmitate, all lipids with known beneficial functions on skin e.g., emollients, provide initial evidence that lotion use not only affects the skin barrier directly but also can potentially alter the skin microbiome to a state which may provide additional skin care benefits.\n\nCo-occurrence network analysis has become a common analysis tool for assessment of the human microbiome37,38. Standard network analysis of study groups indicated no significant differences between subjects following lotion use. Standard network analysis approaches, where all subjects are collapsed into predetermined groups, suffers from significant limitations as it does not account for individual response to interventions. It is well documented that a high level of inter-individual variation occurs in the human skin microbiome in particular with regards to less dominant community members4. Recently, methodologies have been developed to examine microbiome networks at an individual level to facilitate the examination of an individual’s response to intervention27. Examination of single sample networks showed that all study subjects showed improvement in commonly used network analysis metrics including mean degree, edge number, node number and network robustness. Increases in these metrics are generally considered to indicate a more robust and interconnected microbiome network consistent with a healthier state. Based on these metrics a more health associated microbiome was present following the product intervention in line with the aforementioned improvement in key skin biomarkers.\n\nFinally, we sought to address the increase in the levels of X. campestris following lotion use. An increase in the abundance of Xanthomonas following use of cosmetic products has previously being reported39–41 however bacteria of the genus Xanthomonas have rarely been reported in non-intervention-based studies of the skin microbiome at significant levels. Analysis of the test product showed the presence of xanthan gum, a common cosmetic ingredient to stabilise emulsions. Xanthan gum is produced by fermentation of monosaccharides by Xanthomonas campestris. None of the steps in the current production process would be sufficient to remove DNA from the producing organism during the purification process42. Subsequent analysis showed that both the xanthan gum and body lotion used in this study contained DNA that mapped to X. campestris (> 95% of reads generated, data not shown) suggesting this as the source of the increase, as opposed to any change in the skin microbiome as previously reported. These findings highlight the need to consider all potential sources of contamination in particular when assessing low biomass samples and an unexpected increase in an organism not commonly regarded as a skin commensal.\n\nDue to the natural variation found in the skin microbiome which can be impacted by gender, age, body site and environmental conditions the study population was limited to pre-menopausal female subjects between the ages of 18–55. Subsequent studies could examine the impact of lotion application on a wider age cohort and include both male and female subjects and sample from alternative body sites. Examination of dose response is also feasible to examine the impact on skin parameters and microbiome compositions with differing concentrations of active ingredients.\n\nThis study set out to investigate the impact of moisturising lotion use on both skin health and microbiome structure and function in subjects with cosmetic dry skin. Our results show that BL provided increases in SC lipid content and cohesivity, with associated improvements in visual dryness and skin hydration. The impact of emollient use has been examined for a number of conditions including atopic skin43,44 and diaper dermatitis45. Studies, in diseased, atopic, populations show that emollient use reduces the levels of S. aureus with subsequent increases in alpha diversity and in some cases increases in the relative abundance of S. epidermidis. However, no information was previously available on the impact of a moisturizing lotion on the skin microbiome in subjects with cosmetic dry skin, a non-diseased population, where S. aureus is not correlated with the condition. Our data demonstrate that the composition, metabolic potential, and interconnectivity of the microbiome are improved following lotion use. This included quantitative increases in the known beneficial skin bacterium, S. epidermidis. This is the first demonstration of such an effect on cosmetically dry skin as a result of moisturiser application and suggests that improvements in skin barrier function may be, in part, mediated by alterations in the skin microbiome composition, function, and connectivity."}, {"title": "Materials and methods", "text": "", "subsections": [{"title": "Ethics statement", "text": "Written informed consent was obtained from all enrolled individuals. The study protocol was approved by the Reading Independent Ethics Committee. Methods were carried out in accordance with the principles of the Declaration of Helsinki and Good Clinical Practice as applicable to clinical studies on cosmetics."}, {"title": "Study participants", "text": "Female subjects were recruited following appropriate inclusion and exclusion criteria including being aged 18–55 years with moderate levels of skin dryness on both lower outer legs. A full list of inclusion and exclusion criteria can be seen in Supplementary Tables 1 and 2. Skin sites were graded based on the dryness scale found in Supplementary Table 3. Subjects enrolled in the study had scores between 2.0 and 3.0 on the dryness scale and ≤ 1.0 on the erythema scale."}, {"title": "Study design", "text": "This was a single centre, 5-week, balanced incomplete-block design, lower-leg study. Three cells were investigated in this study, as outlined in Fig. 5. Only the data generated for one of the cells, body lotion, are discussed here. Prior to any skin assessments subjects were instructed to not apply any products, including study lotion, to their lower legs for 48 h. On the day of measurements, subjects were equilibrated in a temperature and humidity-controlled room (temperature 20 °C, relative humidity 50%) for 15 min ahead of assessments and sampling. Baseline measurements of skin dryness were conducted, followed by sampling of the skin microbiome and the collection of tape strips. Subjects were asked to apply BL twice daily to one lower leg for 5 weeks after which subjects were resampled. All samples were taken approximately 48 h post the last application of lotion.\n\n[Figure: Figure 5]"}, {"title": "Skin dryness assessment", "text": "Visual assessment of skin dryness and erythema was conducted by a trained evaluator on a scale from 0 to 446. Thirty seven subjects with visual dryness of 2.0–3.0 and erythema of ≥ 1.0 at the baseline visit were enrolled in the study. Corneometer assessments were taken, after an acclimation period of 15 min in an environmentally controlled room using the Courage and Khazaka Multi-Probe Adaptor Corneometer (MPA 6). Five readings were taken at each test site at both study timepoints."}, {"title": "Stratum corneum cohesivity assessment", "text": "Stratum corneum cohesivity was assessed as described previously47 for all study subjects. D-Squame tapes (D100, 22 mm diameter, Clinical and Derm LLC) were applied to the designated area, pressed firmly onto the skin for 2 s with a D-Squame Pressure Instrument (Clinical and Derm D-500) to ensure constant pressure for each tape, then removed using forceps. Sequential tapes were taken from the same site then stored at − 20 °C. Total proteins were extracted from the tapes47 and assayed using the Pierce BCA assay kit (Rockford, IL, USA)."}, {"title": "Sample collection and extraction of stratum corneum lipids", "text": "Stratum corneum lipids were analysed from a population subset (n = 18) at both study timepoints. Cholesterol, ceramides, and FFAs were measured from samples collected using Leukoflex tape strips (2.5 cm × 8 cm) (BSN Medical, UK). Up to 20 sequential tapes were collected from each site and stored at − 20 °C prior to extraction. All tapes were collected, stored and extracted individually. FFA and Cholesterol analyses were performed on pooled sets of 5 tapes, whist ceramide analyses were performed on a pooled sample from all 20 tapes taken at a specific site. Detailed methods for the extraction, and quantification of FFA, cholesterol and ceramides can be found in Supplementary Information."}, {"title": "Microbiome sample collection and processing", "text": "Buffer washes were collected from all participants using a sterile Teflon sampling ring using the cup scrub method48 as previously described9. Details of DNA extraction, library preparation, sequencing, informatics processing and qPCR are outlined in Supplementary Information."}, {"title": "Microbiome network of the population (MNP) analysis", "text": "Co-occurrence network analysis was carried out using the Microbiome Network of the Population (MNP) method on QIIME2 generated ASV tables collapsed at species level. Taxa were filtered based on 0.01% relative abundance and 37% prevalence thresholds. Networks were inferred using Sparse InversE Covariance estimation for Ecological Association and Statistical Inference (SPIEC-EASI version 1.0.7)49. The neighbourhood method was chosen50 and the StARS (Stability Approach to Regularization Selection) method51 used with a lambda max threshold of 0.01.\n\nReproducibility of the network inference was performed using randomly resampled subsets. Sample subsets were resampled at the 80% level and used to generate 1000 networks. Mean values of the network connectivity and robustness features from the networks were compared using bootstrap hypothesis testing52."}, {"title": "Microbiome network of an individual (MNI) analysis", "text": "Networks for individual samples within the population were calculated using the microbiome network of an individual (MNI) method53. Networks generated via this method with an individual sample removed, are subtracted from the MNPs of the whole sample set, resulting in a network specific for that sample."}, {"title": "Network connectivity and robustness calculations", "text": "Network connectivity measures were calculated using the R package igraph (version 1.2.4.1)54. Network fragility was simulated by removing nodes sequentially and calculating the remaining size of the largest connected component55,56. Nodes were removed based on decreasing betweenness centrality and node degree and the stability assessed by natural connectivity; the average eigenvalue of the graph adjacency as the graph reduces in size. The robustness score was calculated as the Area Under the Curve (AUC) of the network fragility values."}, {"title": "Statistical analysis", "text": "A detailed description o  "0.08", "0.28", "0.09", "1.22", "0.03"], ["NdS", "0.30", "0.07", "0.36", "0.07", "1.2", "0.06"], ["NH", "0.47", "0.15", "0.63", "0.22", "1.35", "0.004"], ["NP", "0.35", "0.10", "0.45", "0.10", "1.27", "0.024"], ["NS", "0.28", "0.09", "0.38", "0.12", "1.34", "0.001"]], "footnotes": "Average levels are given for each ceramide class in pmol/µg protein. Fold change was calculated for post intervention relative to baseline values with paired Wilcoxon testing used to assess the differences."}], "assets": [{"assetType": "figure", "label": "Figure 1", "caption": "Lotion application improved leg skin hydration and cohesivity. Skin hydration was assessed at baseline and after 5 weeks of lotion application (n = 37) via (a) visual dryness and (b) corneometer. Stratum corneum cohesivity was assessed by protein removal on (c) 5 sequential tape strips and (d) 20 sequential tape strips (n = 36). Box whisker plots showing mean and upper and lower quartiles. Connecting line with an asterisk indicates a statistically significant difference.", "id": "Fig1", "sectionTitle": "Assessment of skin barrier properties", "href": "41598_2022_9231_Fig1_HTML.jpg"}, {"assetType": "figure", "label": "Figure 2", "caption": "Skin hydration correlates with fatty acid and ceramide levels. Scatter plots of corneometer readings of skin hydration vs. the total level of FFA (a) and total ceramides (b). Blue and red circles represent untreated and after 5 weeks of product application. The solid line represents the optimal fit from simple linear regression analysis, with the correlation coefficient r and p-value displayed. Statistical significance was considered as p-value \u003c 0.05.", "id": "Fig2", "sectionTitle": "Assessment of skin barrier properties", "href": "41598_2022_9231_Fig2_HTML.jpg"}, {"assetType": "figure", "label": "Figure 3", "caption": "Skin microbiome assessment at baseline and after 5 weeks of product application. Box and whisker plots summarising the dominant species at (a) baseline and at (b) Week 5. (c) LEfSe analysis of differential microbiome function identified at baseline and Week 5. qPCR analysis of (d) total bacterial count and (e) Staphylococcus epidermidis at baseline and post intervention.", "id": "Fig3", "sectionTitle": "Microbiome assessment", "href": "41598_2022_9231_Fig3_HTML.jpg"}, {"assetType": "figure", "label": "Figure 4", "caption": "Community co-occurrence network analysis. (a) Average community networks for all samples at baseline and following 5 weeks of application, with associated network metrics. (b) Example statistical analysis of network mean degree metric following bootstrapping between samples at baseline and post intervention. No metrics used showed differences between pre- and post-application using average network approaches. (c) Selected indicative examples of single sample network from individual subject at baseline and post intervention. (d) Network analysis metrics between networks at baseline and post intervention.", "id": "Fig4", "sectionTitle": "Microbiome assessment", "href": "41598_2022_9231_Fig4_HTML.jpg"}, {"assetType": "figure", "label": "Figure 5", "caption": "CONSORT 2010 flow diagram. Application of lotion application to legs of subjects classified as having cosmetic dry skin.", "id": "Fig5", "sectionTitle": "Study design", "href": "41598_2022_9231_Fig5_HTML.jpg"}, {"assetType": "supplementary-material", "caption": "Supplementary Information.", "id": "MOESM1", "sectionTitle": "Supplementary Information", "href": "41598_2022_9231_MOESM1_ESM.docx"}]}, "kind": "article", "batch_id": "PUBMED-PILOT-20260926"}, {"id": "PM-PILOT-BEH-S004", "run_id": "SK-BEH-001", "source_id": "SK-BEH-001-S004", "doi": "10.1111/ced.12455", "title": "Does poor sleep quality affect skin ageing?", "status": "no-oa", "channel": "PubMed MCP → PMC / Europe PMC / Unpaywall", "result_summary": "本次公开获取路线未取得开放全文，原资料仍为仅摘要。", "limits": ["PMC 无对应全文；Europe PMC 无 PMC 对应记录；Unpaywall 未索引到开放副本。", "仅说明本次路线未成功，不能推断所有渠道均无全文。", "未增加来源或合格深读。"], "r s [music] to treat dry skin and\nprevent it in the future.\nTake short baths and [music] showers to\nhydrate your dry skin. When bathing, be\nsure to keep the bathroom door closed.\nUse warm [music] water instead of hot\nand limit your time in the water to 5 to\n10 minutes. After your shower or bath,\ngently [music] pat your skin dry. Within\na few minutes of drying off, apply\nmoisturizer [music] to your skin.\nMoisturizers work by trapping existing\nmoisture in your skin. Ointments and\ncreams are more effective and [music]\nless irritating than lotions. To relieve\ndry hands, carry a non-greasy hand cream\nwith you and apply it after each [music]\nhand wash. Wear lip balm or apply\npetroleum jelly to your lips. If your\nlips sting or tingle after you apply a\nlip balm, switch to one that does\n[music] not cause this reaction. Only\nuse gentle fragrance-free skincare\nproducts. Products with fragrance or\nalcohol can be harsh for dry, sensitive\n[music] skin. If you see the word\nunscented rather than fragrance-free,\nthe product can contain chemicals that\nneutralize [music] or hide the odors of\nother ingredients. These chemicals can\nirritate dry skin. To reduce [music] dry\nraw skin on your hands, wear gloves when\nyou go outside in the winter. You should\nalso wear gloves before you [music]\nperform tasks that get your hands wet,\nlike washing dishes, and before you get\nchemicals, greases, and other substances\n[music] like cleaning solutions on your\nhands. Choose non-erritating clothes and\n[music] laundry detergent. Wear soft\nfabric like cotton or silk under wool or\nother rough clothing. Use laundry\n[music] detergent labeled\nhypoallergenic.\nAvoid sitting close to fireplaces\n[music] or other heat sources. Doing so\ncan dry out your skin. Opt for a thick\n[music] blanket or wear warm layers\ninstead. Lastly, add moisture to [music]\nthe air by using a humidifier. Dry skin\nalso can be a sign of a skin condition\nthat needs treatment. If these changes\   el.innerHTML=`<p class="small muted">${summary?'原视频内容的中文概括':'以下为 AI 内容分析，区别于原视频观点'} · 基于自动字幕，尚未经人工校对</p><div class="video-reader video-summary mt" role="region" aria-label="${summary?'中文概要与核心观点':'内容分析与研究用途'}" tabindex="0">${summary?`<section class="subsection"><h3>整篇讲什么</h3><p>${esc(analysis.overview)}</p></section><section class="subsection"><h3>核心观点 · 原视频</h3><ul class="text-list">${analysis.key_points.map(x=>`<li><strong>${esc(x.title)}</strong> <a class="small" href="${esc(v.url+'&t='+x.start_seconds+'s')}" target="_blank" rel="noopener noreferrer" aria-label="在原视频核对：${esc(x.title)}（${esc(x.source_label)}）">${esc(x.source_label)} ↗</a><p>${esc(x.text)}</p></li>`).join('')}</ul><p class="small muted mt">${esc(analysis.care_boundary)}</p></section><section class="subsection"><h3>内容解读 · AI 分析</h3><p>${esc(analysis.interpretation)}</p></section>`:analysis.analysis_sections.map(x=>`<section class="subsection"><h3>${esc(x.title)}</h3><p>${esc(x.text)}</p></section>`).join('')}</div>`;
 }else if(part==='overview'){
  el.innerHTML=`${videoFacts(a)}<div class="operation-bar"><a href="${esc(v.url)}" target="_blank" rel="noopener noreferrer">打开原视频 ↗</a><a href="${esc(v.channel_url)}" target="_blank" rel="noopener noreferrer">查看发布账号 ↗</a></div><p class="note mt">已取得 ${sub.cue_count} 条字幕时间片，整理为 ${sub.text_line_count} 行英文。自动字幕尚未经人工校对，兴趣门槛仍待核验。</p><details><summary>视频简介（原文）</summary><div class="reader video-reader mt" role="region" aria-label="视频简介原文" tabindex="0">${esc(v.description)}</div></details>`;
 }else{
  const raw=part==='vtt';el.innerHTML=`<p class="note">英文自动字幕，未经人工校对。${raw?'原始 VTT 保留时间戳及滚动字幕的重复文本。':esc(sub.processing)}</p><div class="reader video-reader mt" role="region" aria-label="${raw?'字幕原始时间片':'字幕阅读内容'}" tabindex="0">${esc(raw?sub.vtt:sub.text)}</div><div class="operation-bar"><button data-action="export-subtitle-text" data-id="${esc(id)}">下载字幕 TXT ↓</button><button data-action="export-subtitle-vtt" data-id="${esc(id)}">下载原始 VTT ↓</button></div>`;
 }
}

function sourceHost(s){try{return new URL(s.url).hostname.replace(/^www\./,'')}catch{return '未记录网址'}}
function sourceBadges(s){const host=sourceHost(s),a=acquisitions().find(a=>a.source_id===s.id);return `<div class="provenance">${tag(host==='pubmed.ncbi.nlm.nih.gov'?'PubMed 条目':host,'blue')}${a?tag(a.status==='retrieved'?'PubMed MCP 补取 · 已取得正文':'PubMed MCP 补取 · 本次未取得全文',a.status==='retrieved'?'blue':'warn'):''}</div>`}
function provenanceDetails(s){const logs=D().search_log.filter(l=>(l.source_ids||[]).includes(s.id)),found=logs.find(l=>/search/i.test(l.route||'')),a=acquisitions().find(a=>a.source_id===s.id);return `${sourceBadges(s)}<dl class="details-list"><div><dt>最早可追溯获取记录</dt><dd>${found?`网络检索 · ${esc(found.route)}<p class="small muted">${esc(found.id)} · ${esc(found.query||found.query_text||'')}</p>`:logs.length?`已有原页读取记录，未单独记录最初发现渠道。<p class="small muted">${esc(logs[0].id)} · ${esc(logs[0].route||'未标注路线')}</p>`:'原研究包未单独记录最初发现渠道。'}</dd></div><div><dt>本次补取</dt><dd>${a?`${esc(a.channel)} · ${esc(acquisitionBatch(a).acquired_on)}<p>${esc(a.result_summary)}</p><button class="linkbtn" data-detail="acquisitions" data-id="${esc(a.id)}">查看实际获取成果 →</button>`:'未参与这次 PubMed MCP 试跑。'}</dd></div></dl>`}
function acquisitionDetail(id){const a=acquisitions().find(x=>x.id===id);if(!a)return;if(a.kind==='video'){videoDetail(a);return;}const batch=acquisitionBatch(a),v=a.article;const links=v?[['PubMed 条目',v.pubmedUrl],['PMC 全文',v.pmcUrl]]:[];showDialog('实际获取成果',`<div class="row wrap">${tag(a.status==='retrieved'?'已取得正文':'本次未取得全文',a.status==='retrieved'?'blue':'warn')}${tag('已有文献补取')}</div><h3 class="mt">${esc(a.title)}</h3><p class="small muted mt">${esc(a.channel)} · ${esc(acquisitionBatch(a).acquired_on)}<br>关联资料 ${esc(a.source_id)} · DOI ${esc(a.doi)}${v?`<br>PMID ${esc(v.pmid)} · PMCID ${esc(v.pmcId)}`:''}</p><p class="mt">${esc(a.result_summary)}</p><div class="operation-bar">${links.filter(([,url])=>/^https?:\/\//.test(url||'')).map(([label,url])=>`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${label} ↗</a>`).join('')}</div><div class="note warn mt">${a.limits.map(x=>`<p>${esc(x)}</p>`).join('')}</div>${v?`<div class="field mt"><label for="article-part">阅读取得的原文内容</label><select id="article-part" data-id="${esc(a.id)}"><option value="abstract">摘要</option>${(v.sections||[]).map((s,i)=>`<option value="section:${i}">正文 ${i+1} · ${esc(s.title||'未命名章节')}</option>`).join('')}${(v.tables||[]).map((t,i)=>`<option value="table:${i}">数据表 ${i+1} · ${esc(t.label||t.caption||'')}</option>`).join('')}<option value="assets">图与附件指针（未读取附件）</option></select></div><div id="article-content" class="mt"></div>`:''}<details><summary>获取记录与技术来源</summary><p class="small">工具 ${esc(batch.tool)} · ${esc(batch.provider)}<br>批次 ${esc(batch.batch_id)}<br>证据位置 ${esc(a.raw_evidence)}<br>${esc(batch.note)}</p></details>`,'', $('#dialog').open);if(v)articlePart(id,'abstract')}
function articlePart(id,part){const a=acquisitions().find(x=>x.id===id)?.article,el=$('#article-content');if(!a||!el)return;const [kind,n]=part.split(':');const section=s=>`<h3>${esc(s.title||'')}</h3><div class="reader mt">${esc(s.text||'')}</div>${(s.subsections||[]).map(section).join('')}`;if(kind==='abstract')el.innerHTML=`<h3>摘要</h3><div class="reader mt">${esc(a.abstract||'本次未返回摘要')}</div>`;else if(kind==='section'&&a.sections[n])el.innerHTML=section(a.sections[n]);else if(kind==='table'&&a.tables[n]){const t=a.tables[n];el.innerHTML=`<h3>${esc(t.label||'数据表')}</h3><p class="mt">${esc(t.caption||'')}</p><div class="reader-table"><table>${t.rows.map((row,i)=>`<tr>${row.map(v=>`<${i<(t.headerRowCount||0)?'th':'td'}>${esc(v)}</${i<(t.headerRowCount||0)?'th':'td'}>`).join('')}</tr>`).join('')}</table></div><div class="reader mt">${esc(Array.isArray(t.footnotes)?t.footnotes.join('\n'):t.footnotes||'')}</div>`}else if(kind==='assets')el.innerHTML=`<p class="note">以下为接口返回的图与附件指针。未下载附件、未读取其内容；需要查看时请前往 PMC 原文。</p>${a.assets.map(x=>`<div class="list-item"><h3>${esc(x.label||x.id)}</h3><p>${esc(x.caption||'')}</p><p class="small muted">${esc(x.assetType)} · ${esc(x.href)}</p></div>`).join('')}`;}
async function run(fn){if(busy)return;busy=true;try{await fn()}catch(e){const el=$('[data-operation-error]');if(el)el.textContent=e.message;else showDialog('操作未完成',`<p class="error-banner" role="alert">${esc(e.message)}</p>`)}finally{busy=false}}
async function load(doc){const next=C.copy(doc),audit=await C.audit(next,policy);if(audit.errors.length)throw Error(audit.errors.join('\n'));let i=DATA.findIndex(d=>d.run_id===next.run_id);if(i<0){i=DATA.length;DATA.push(next);states.push(freshState(next))}else{DATA[i]=next;states[i]=freshState(next)}active=i;closeDialog();render();toast(audit.stale.length?'已载入；过期冻结已标为失效，需重新确认。':'研究记录已载入。')}
async function change(fn,message){const next=C.copy(D());await fn(next);const a=await C.audit(next,policy);if(a.errors.length)throw Error(a.errors.join('\n'));DATA[active]=next;S().dirty=true;closeDialog();render();toast(message+(a.stale.length?'；过期冻结已标为失效。':''))}
function actorFields(){return `<div class="field"><label for="actor-type">本次决定者身份</label><select id="actor-type" name="actor_type"><option value="user">使用者本人</option><option value="controller_delegate">主控代理</option><option value="qualified_reviewer">具备资质的审核者</option></select></div><div class="field"><label for="actor-label">姓名或可追溯标识 · 必填</label><input id="actor-label" name="actor_label" required></div><div class="field"><label for="actor-qualification">资质说明（如适用）</label><input id="actor-qualification" name="qualification"></div>`}
const actor=f=>({actor_type:f.get('actor_type'),actor_label:String(f.get('actor_label')||'').trim(),qualification:String(f.get('qualification')||'').trim()||null});
function operationForm(kind,body,button){return `<form data-operation="${kind}" class="stack mt">${body}<p data-operation-error class="error" role="alert"></p><button class="primary" type="submit">${button}</button></form>`}
function reviewRows(){return D().branches.map(b=>({branch_id:b.id,...(S().drafts[b.id]||C.review(D(),b.id)||{action:'gap',reason:'',required_changes:null})})).map(({branch_id,action,reason,required_changes})=>({branch_id,action,reason,required_changes:required_changes||null}))}
function reviewSubmit(){const rows=reviewRows();showDialog('提交全部分支审阅',`<p class="small muted">核对每支意见后登记本次身份。提交会使后续方向和交付冻结失效，需要重新确认。</p>${rows.map(r=>`<div class="list-item"><h3>${esc(byId('branches',r.branch_id).title)} · ${esc(L(r.action))}</h3><p>${esc(r.reason||'尚未填写意见，请返回该分支补齐。')}</p></div>`).join('')}${operationForm('reviews',actorFields(),'登记并提交全部意见')}`)}
function freezeForm(kind){const a=byId('candidates',S().candidate);if(kind==='direction'&&!currentCandidates().some(x=>x.id===a?.id))throw Error('请先生成并选择当前版本的方向草稿。');showDialog({review:'冻结本版分支审阅',direction:'确认并冻结方向',package:'冻结本版交付包'}[kind],`<div class="note">冻结保留输入、决定者、理由与证据链。后续修改可能使本版失效；冻结不代表证据缺口已关闭。</div>${operationForm('freeze-'+kind,`${kind==='direction'?`<p>${esc(a.title)}</p><input type="hidden" name="candidate_id" value="${esc(a.id)}"><div class="field"><label for="classification">交付分类</label><select id="classification" name="classification"><option value="trial_with_gaps">含缺口试运行</option><option value="formal">正式（需通过科学与兴趣门槛）</option></select></div><div class="field"><label for="selection-reason">选择理由 · 必填</label><textarea id="selection-reason" name="reason" required></textarea></div>`:''}${actorFields()}`,'检查并冻结')}`)}
function assessForm(){const a=byId('candidates',S().candidate);if(!currentCandidates().some(x=>x.id===a?.id))throw Error('历史方向仅供查阅，请先生成当前版本的方向草稿。');showDialog('记录方向评估',`<p>${esc(a.title)}</p><div class="note mt">填写评估不会替代证据核验，准入仍由完整材料与双门槛决定。</div>${operationForm('assess',`<input type="hidden" name="candidate_id" value="${esc(a.id)}"><div class="field"><label for="science-strength">科学证据强度</label><select id="science-strength" name="strength">${['unknown','weak','medium','strong'].map(v=>`<option value="${v}" ${a.science_gate.strength===v?'selected':''}>${({unknown:'未知',weak:'弱',medium:'中',strong:'强'})[v]}</option>`).join('')}</select></div><div class="field"><label for="science-reasons">科学判断理由 · 每行一项</label><textarea id="science-reasons" name="science_reasons" required>${esc(arr(a.science_gate.reasons).join('\n'))}</textarea></div><div class="field"><label for="interest-level">用户兴趣</label><select id="interest-level" name="level">${['unknown','low','medium','high'].map(v=>`<option value="${v}" ${a.interest_gate.level===v?'selected':''}>${({unknown:'未知',low:'低',medium:'中',high:'高'})[v]}</option>`).join('')}</select></div><div class="field"><label for="interest-reasons">兴趣判断理由 · 每行一项</label><textarea id="interest-reasons" name="interest_reasons" required>${esc(arr(a.interest_gate.reasons).join('\n'))}</textarea></div><div class="field"><label for="comparison-basis">用于比较的基准</label><textarea id="comparison-basis" name="comparison_basis">${esc(a.interest_gate.comparison_basis||'')}</textarea></div><fieldset><legend>关联平台材料</legend>${D().signals.map(s=>`<label class="inline-check"><input name="signal_ids" type="checkbox" value="${esc(s.id)}" ${a.signal_ids.includes(s.id)?'checked':''}><span>${esc(s.id)} · ${esc(s.indexed_title||s.platform)}</span></label>`).join('')||'<p class="small muted">还没有平台材料。</p>'}</fieldset>`,'保存评估')}`)}
function filesDialog(){let keys=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('sk-workbench-v01:'))keys.push(k.slice('sk-workbench-v01:'.length))}}catch{}showDialog('保存 / 导入 / 导出',`<div class="note">页面里的修改不会自动写回磁盘文件。保存到本机浏览器可供恢复；长期留存请导出 JSON，发给别人阅读请导出 HTML。</div><h3 class="mt">当前任务 · ${esc(D().run_id)}</h3><div class="operation-bar"><button data-action="save-local">保存到本机浏览器</button><button data-action="export-json">导出研究 JSON</button><button data-action="export-html">导出完整 HTML</button><button data-action="export-acquisitions">导出获取成果 JSON</button></div><div class="field mt"><label for="import-file">导入研究 JSON（相同 ID 会替换当前浏览器里的该任务）</label><input id="import-file" type="file" accept=".json,application/json"></div>${keys.length?operationForm('restore',`<div class="field"><label for="saved-run">恢复本机已保存任务</label><select id="saved-run" name="run_id">${keys.sort().map(k=>`<option>${esc(k)}</option>`).join('')}</select></div>`,'恢复所选任务'):'<p class="small muted mt">本机浏览器尚无已保存任务。</p>'}`)}
function download(value,name,type='application/json'){const blob=new Blob([type==='application/json'?JSON.stringify(value,null,2):value],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportHTML(){const html=document.documentElement.cloneNode(true);html.querySelector('#dialog').removeAttribute('open');html.querySelector('#dialog').innerHTML='';html.querySelector('#content').innerHTML='';html.querySelector('#toast').textContent='';html.querySelector('#app').classList.remove('menu-open');html.querySelector('body').removeAttribute('data-ready');const data={...boot,runs:[C.copy(D())],acquisitions:acquisitionExport()};html.querySelector('#boot-data').textContent=JSON.stringify(data).replace(/</g,'\\u003c');download('<!doctype html>\n'+html.outerHTML,D().run_id+'-工作台.html','text/html')}
function handleAction(a,b){if(a==='files')filesDialog();else if(a==='policy')showDialog('策略与预算记录',`<p class="note">沿用原任务累计额度；页面接入和全文补取不会重置额度。未执行的请求不计作实际消耗。</p><h3 class="mt">当前预算记录</h3>${textValue(C.budget(D(),policy))}<details><summary>绑定策略原始记录</summary><pre>${esc(JSON.stringify(policy,null,2))}</pre></details><details><summary>检索与读取日志（${D().search_log.length} 条）</summary><pre>${esc(JSON.stringify(D().search_log,null,2))}</pre></details>`);else if(a==='submit-reviews')reviewSubmit();else if(a.startsWith('freeze-'))run(async()=>freezeForm(a.slice(7)));else if(a==='assessment')run(async()=>assessForm());else if(a==='drafts')run(async()=>{await change(d=>C.makeCandidates(d),'已生成当前审阅对应的方向草稿。');S().candidate=currentCandidates()[0]?.id;render()});else if(a==='save-local')run(async()=>{localStorage.setItem('sk-workbench-v01:'+D().run_id,JSON.stringify(D()));S().dirty=false;closeDialog();render();toast('已保存到本机浏览器。待提交意见请先提交；长期留存请导出。')});else if(a==='export-json')download(D(),D().run_id+'-研究记录.json');else if(a==='export-html')exportHTML();else if(a==='export-acquisitions')download(acquisitionExport(),D().run_id+'-实际获取成果.json');else if(a==='export-subtitle-text'||a==='export-subtitle-vtt'){const v=acquisitions().find(x=>x.id===b.dataset.id)?.video;if(v){const raw=a==='export-subtitle-vtt';download(raw?v.subtitles.vtt:v.subtitles.text,v.id+'.en.'+(raw?'vtt':'txt'),raw?'text/vtt':'text/plain')}}}
function handleSubmit(form){run(async()=>{if(!form.reportValidity())return;const f=new FormData(form),op=form.dataset.operation;if(op==='reviews'){await change(d=>C.saveReview(d,policy,reviewRows(),actor(f)),'全部分支审阅已提交。');S().drafts={};render()}else if(op.startsWith('freeze-')){const kind=op.slice(7),selection=kind==='direction'?{candidate_id:f.get('candidate_id'),classification:f.get('classification'),reason:String(f.get('reason')).trim()}:null;await change(d=>C.snapshot(d,policy,kind,actor(f),selection),'冻结成功；请保存或导出。')}else if(op==='assess'){await change(d=>{const a=d.candidates.find(x=>x.id===f.get('candidate_id'));C.invalidate(d,'direction','方向评估已修改，需重新确认');a.science_gate={...a.science_gate,strength:f.get('strength'),reasons:lines(f.get('science_reasons'))};a.interest_gate={...a.interest_gate,level:f.get('level'),reasons:lines(f.get('interest_reasons')),comparison_basis:String(f.get('comparison_basis')).trim()||null};a.signal_ids=f.getAll('signal_ids');const g=C.gates(d,a,policy);a.science_gate.status=g.science.pass?'pass':'insufficient';a.interest_gate.status=g.interest.pass?'pass':'insufficient'},'方向评估已保存。')}else if(op==='restore'){const raw=localStorage.getItem('sk-workbench-v01:'+f.get('run_id'));if(!raw)throw Error('本机没有这份已保存记录。');await load(JSON.parse(raw))}else if(op==='request'){const request=Object.fromEntries([...f].map(([k,v])=>[k,String(v).trim()]));if(!request.route)throw Error('请填写实际执行路线。');const result=C.canRequest(D(),policy,request);if(!result.allowed)throw Error(result.reasons.join('\n'));download({schema_version:'0.1',run_id:D().run_id,input_revision:D().revision,config_ref:D().config_ref,created_at:new Date().toISOString(),status:'not_executed',request,gap:byId('gaps',request.gap_id),budget:C.budget(D(),policy),note:'本请求未执行、未预占额度。执行前核对当前记录与累计预算；交回来源、定位、局限及未解决部分。'},D().run_id+'-补证请求.json');toast('预算检查通过，已导出未执行的请求。')}})}
window.addEventListener('beforeunload',e=>{if(states.some(s=>s.dirty||Object.keys(s.drafts).length)){e.preventDefault();e.returnValue=''}});

try {if(!await C.verifyPolicy(policy))throw Error('绑定策略校验失败');for(const d of DATA){const a=await C.audit(d,policy);if(a.errors.length)throw Error(d.run_id+'：'+a.errors.join('；'));}initialized=true;render();syncMenu();document.body.dataset.ready='true';}catch(e){$('#content').innerHTML='<div class="error-banner" role="alert">'+esc(e.message)+'</div>';}



})();
</script>
</body></html>
